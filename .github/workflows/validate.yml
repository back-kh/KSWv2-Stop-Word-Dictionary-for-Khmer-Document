name: Dictionary validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Reproduce data and audit; verify vocabulary and licenses
        run: python scripts/build_resources.py --check
      - name: Test loaders, filtering, demos, and failure handling
        run: python -m unittest discover -s tests -v
      - name: Check dependency-free daily-use example
        run: python Khmer_stop_word_using_DirectFilter.py

  optional-backends:
    name: ${{ matrix.os }} / real optional segmenters
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      KSWV2_REQUIRE_BACKENDS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional test backends
        run: python -m pip install -r requirements-test-backends.txt
      - name: Test with real KhmerCUT and Khmer-NLTK backends (no skips)
        run: python -m unittest discover -s tests -v
